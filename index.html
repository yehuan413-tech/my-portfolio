<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f7f7f7;
            color: #333;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .card p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>你的名字</h1>
    <p class="subtitle">个人作品展示</p>

    <div class="card">
        <h2>作品一：作品名称</h2>
        <p>这里写一句作品介绍，比如：这是我设计的一张海报。</p>
    </div>

    <div class="card">
        <h2>作品二：作品名称</h2>
        <p>这里写一句作品介绍，比如：这是我拍摄的一组照片。</p>
    </div>

    <div class="card">
        <h2>作品三：作品名称</h2>
        <p>这里写一句作品介绍。</p>
    </div>
</body>
</html>
